services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym && psql -U gym -d gym -Atqc \"SELECT count(*) = 5 FROM cards\" | grep -qx t"]
      interval: 2s
      timeout: 3s
      retries: 20
