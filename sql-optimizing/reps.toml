[rep_set]
slug = "sql-optimizing"

[env]
requires = ["docker"]
up    = "docker compose up -d --wait"
reset = "docker compose down -v && docker compose up -d --wait"
down  = "docker compose down -v"

[run]
cmd = "docker compose exec -T db psql -q -v ON_ERROR_STOP=1 -U gym -d gym -f - < reps/{n}/answer.sql"
